name: Deploy to Self-Hosted

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: [self-hosted, client]
    outputs:
      image-tag: ${{ steps.build.outputs.image-tag }}

    steps:
    # 1. 코드 체크아웃
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Node.js 환경 설정 (버전 20)
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 3. pnpm 설치
    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: latest

    # 4. pnpm 캐시 경로
    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    # 5. pnpm 캐시 설정
    - name: Setup pnpm cache
      uses: actions/cache@v3
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    # 6. 프로젝트 의존성 설치
    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    # 7. 환경변수 파일 생성
    - name: Create .env file
      run: |
        echo "${{ secrets.PROD_CONFIG }}" > .env.local

    # 8. Docker Hub 로그인 (Keychain-Free)
    - name: Docker Hub Login
      env:
        DOCKER_CONFIG: $HOME/.docker   # 홈 디렉토리 기반 Docker 설정
      run: |
        mkdir -p $DOCKER_CONFIG
        echo '{"credsStore":""}' > $DOCKER_CONFIG/config.json
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    # 9. Docker 이미지 빌드
    - name: Build Docker image
      id: build
      run: |
        docker build -t sols-client:${{ github.sha }} .
        echo "image-tag=${{ github.sha }}" >> $GITHUB_OUTPUT

    # 10. 빌드 결과 확인
    - name: Verify build
      run: docker images | grep sols-client

  deploy:
    needs: build
    runs-on: [self-hosted, client]

    steps:
    # 1. 기존 컨테이너 정리
    - name: Stop and remove existing container
      run: |
        docker stop sols-client || true
        docker rm sols-client || true

    # 2. 새로운 Docker 컨테이너 실행
    - name: Run new container
      run: |
        docker run -d \
          --name sols-client \
          --restart unless-stopped \
          -p 3000:3000 \
          --env-file .env.local \
          sols-client:${{ needs.build.outputs.image-tag }}

    # 3. 컨테이너 상태 확인
    - name: Verify container status
      run: |
        sleep 5
        docker ps | grep sols-client

    # 4. 헬스체크
    - name: Health check
      run: |
        sleep 10
        curl -f http://localhost:3000 > /dev/null 2>&1

    # 5. 정리 작업 (불필요한 이미지 삭제)
    - name: Clean up old images
      run: docker image prune -f
