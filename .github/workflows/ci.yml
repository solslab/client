name: Deploy to Self-Hosted (ARM 최적화)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: [self-hosted, client]
    outputs:
      image-tag: ${{ steps.build.outputs.image-tag }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: latest

    - name: Get pnpm store directory
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    # 5. pnpm 캐시 압축 (pigz 사용)
    - name: Setup pnpm cache
      uses: actions/cache@v3
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
        compression: "pigz"

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Create production .env file
      run: echo "${{ secrets.PROD_CONFIG }}" > .env.production

    - name: Build Docker image
      id: build
      run: |
        docker build -t sols-client:${{ github.sha }} .
        echo "image-tag=${{ github.sha }}" >> $GITHUB_OUTPUT

    - name: Verify build
      run: docker images | grep sols-client

  deploy:
    needs: build
    runs-on: [self-hosted, client]

    steps:
    - name: Stop and remove existing container
      run: |
        docker stop sols-client || true
        docker rm sols-client || true

    - name: Run new container
      run: |
        docker run -d \
          --name sols-client \
          --restart unless-stopped \
          -p 3000:3000 \
          --env-file .env.production \
          sols-client:${{ needs.build.outputs.image-tag }}

    - name: Verify container status
      run: |
        sleep 5
        docker ps | grep sols-client

    - name: Health check
      run: |
        sleep 10
        curl -f http://localhost:3000 > /dev/null 2>&1

    - name: Clean up old images
      run: docker image prune -f
