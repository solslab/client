# Self-Hosted 환경 자동 배포 워크플로우
# main 브랜치에 push가 발생하면 자동으로 실행됩니다
name: Simple CI Test

# 워크플로우 실행 조건: main 브랜치에 push될 때
on:
  push:
    branches: [ main ]

jobs:
  # 간단한 테스트 작업
  test:
    runs-on: [self-hosted, client]
    
    steps:
    # 1. 코드 체크아웃
    - name: Checkout code
      uses: actions/checkout@v4
      
    # 2. 간단한 테스트
    - name: Simple test
      run: |
        echo "Hello from CI test!"
        echo "Current directory: $(pwd)"
        echo "Files in directory:"
        ls -la
        echo "Test completed successfully!"

